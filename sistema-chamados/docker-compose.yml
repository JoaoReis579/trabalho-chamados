services:
  mysql:
    image: mysql:8.4
    container_name: chamados-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chamados
    ports:
      - '3306:3306'
    volumes:
      - chamados_mysql_data:/var/lib/mysql

volumes:
  chamados_mysql_data:
